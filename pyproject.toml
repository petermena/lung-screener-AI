[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lung-screener-ai"
version = "0.1.0"
description = "Lightweight CT lung cancer screening backend + viewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydicom>=2.4.4",
  "numpy>=1.26.4",
  "pandas>=2.2.2",
  "SimpleITK>=2.3.1",
  "Pillow>=10.4.0",
  "streamlit>=1.41.0",
  "plotly>=5.24.1",
  "requests>=2.32.3",
  "torch>=2.3.1",
  "monai>=1.3.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "ui*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.6.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
