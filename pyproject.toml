[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lung-screener"
version = "0.1.0"
description = "AI-powered lung nodule detection for CT scans with PACS integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Peter Mena"},
]

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "monai>=1.3",
    "pydicom>=2.4",
    "pynetdicom>=2.0",
    "nibabel>=5.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "SimpleITK>=2.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "click>=8.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
server = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.scripts]
lung-screener = "lung_screener.cli:main"

[tool.setuptools.packages.find]
include = ["lung_screener*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
