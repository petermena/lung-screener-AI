# Lung Screener AI - Best Model Configuration
#
# Optimized for maximum accuracy on LUNA16 (888 studies) + LUNA25 (4000 studies).
# Uses SE-ResNeXt3D architecture with all advanced training techniques enabled.
#
# Usage:
#   lung-screener -c config/best_model.yaml train
#   lung-screener -c config/best_model.yaml train-kfold -k 5
#   lung-screener -c config/best_model.yaml evaluate -m checkpoints/best.pth

model:
  # SE-ResNeXt3D: state-of-the-art architecture combining grouped
  # convolutions, squeeze-and-excitation attention, multi-scale fusion,
  # and stochastic depth regularization.
  architecture: "se_resnext3d"
  in_channels: 1
  num_classes: 2
  patch_size: [48, 48, 48]
  predict_nodule_type: false
  # Architecture hyperparameters tuned for T4 GPU
  base_filters: 64
  cardinality: 32
  bottleneck_width: 4
  se_reduction: 16
  drop_path_rate: 0.2

training:
  batch_size: 32          # A10G has 24GB VRAM — doubled from T4 config
  learning_rate: 0.0004   # Linear-scaled for 2x batch size
  weight_decay: 0.0001
  epochs: 150             # More epochs to benefit from warm restarts + SWA
  num_workers: 2
  pos_neg_ratio: 0.5

  loss:
    type: "focal"
    focal_gamma: 2.0
    focal_alpha: 0.25      # down-weights easy negatives; addresses 1:10.7 val imbalance

  augmentation:
    rotation: true
    flip: true
    scale_range: [0.9, 1.1]
    noise_std: 0.01
    elastic_deformation: true
    elastic_alpha: 20.0
    elastic_sigma: 3.5
    intensity_shift: 0.05
    intensity_scale: 0.05
    mixup_alpha: 0.0
    cutout: true
    cutout_size: 12
    cutout_n_holes: 2
    # Multi-scale training: disabled until model converges
    # multi_scale_patches: [36, 48, 60]

  # Stochastic Weight Averaging: averages late-training checkpoints
  # for a flatter minimum that generalizes better.
  swa:
    enabled: true
    start_epoch: 100      # SWA in final ~50 epochs
    lr: 0.00005

  early_stopping_patience: 20

  # Cosine warm restarts: periodic LR resets help escape local minima
  # and work synergistically with SWA.
  scheduler:
    type: "cosine_warm_restarts"
    warmup_epochs: 5
    t_0: 25               # First cycle: 25 epochs
    t_mult: 2             # Double cycle length each restart

inference:
  threshold: 0.15
  nms_distance_mm: 10.0
  batch_size: 64          # Conservative for larger model
  validate_input: true
  # TTA: average predictions over 8 geometric transforms
  tta:
    enabled: true
    n_augments: 8

data:
  dataset_dir: "./data/luna16"
  cache_dir: "./data/cache"
  val_split: 0.2
  max_val_candidates: 5000
  training_dir: "./data/training"
  datasets:
    - type: luna16
      dataset_dir: "./data/luna16"
    - type: luna25
      dataset_dir: "./data/luna25"
