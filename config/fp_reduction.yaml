# FP Reduction Training Configuration
#
# Overrides for the second-stage false-positive reduction pipeline.
# Merge with default.yaml:
#
#   python scripts/train_fp_reduction.py --config config/fp_reduction.yaml
#
# Designed for AWS g4dn.xlarge (T4 16GB) or p3.2xlarge (V100 16GB).

# Use all negatives when scoring candidates so we capture every
# hard false positive. A very low pos_neg_ratio effectively disables
# undersampling during the scoring pass.
training:
  pos_neg_ratio: 0.01
  num_workers: 6  # scoring pass is IO-bound; g4dn.xlarge has 4 vCPUs but more workers reduces stalls

# FP reduction model training hyperparameters
fp_reduction_training:
  epochs: 60
  batch_size: 32
  learning_rate: 0.0005
  weight_decay: 0.0001
  early_stopping_patience: 12
  num_workers: 4  # FP training dataset is in-memory; 4 workers matches vCPU count
  # Scale factor for the positive-class weight (default 1.0).
  # Increase (e.g. 1.5) to push the model harder toward sensitivity;
  # decrease (e.g. 0.7) to favor specificity.
  class_weight_scale: 1.0

# Second-stage inference settings
fp_reduction:
  enabled: true
  threshold: 0.5

# First-stage threshold for hard-negative mining
inference:
  threshold: 0.15
