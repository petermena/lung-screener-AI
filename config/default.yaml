# Lung Screener AI - Default Configuration

model:
  # Architecture: "resnet3d", "densenet3d", or "se_resnext3d"
  architecture: "resnet3d"
  # Number of input channels (1 for CT grayscale)
  in_channels: 1
  # Number of output classes: [non-nodule, nodule]
  num_classes: 2
  # Candidate patch size in voxels (z, y, x)
  patch_size: [48, 48, 48]
  # Enable nodule type classification (solid, part-solid, ground-glass)
  predict_nodule_type: false
  # SE-ResNeXt3D specific options (only used when architecture=se_resnext3d)
  base_filters: 64
  cardinality: 32
  bottleneck_width: 4
  se_reduction: 16
  drop_path_rate: 0.2

preprocessing:
  # Resample all scans to this spacing in mm (z, y, x)
  target_spacing: [1.0, 1.0, 1.0]
  # Hounsfield Unit window for lung tissue
  hu_window:
    min: -1200
    max: 600
  # Clip and normalize to [0, 1]
  normalize: true

candidate_detection:
  # Threshold for initial candidate detection (HU value)
  lung_threshold: -400
  # Minimum candidate size in mm
  min_size_mm: 3.0
  # Maximum candidate size in mm
  max_size_mm: 30.0

training:
  # -- Tuned for NVIDIA T4 (16GB VRAM) on g4dn.xlarge (4 vCPUs, 16GB RAM) --
  # Batch 24 uses ~5-6GB with AMP. T4 has less memory bandwidth than A4000,
  # so slightly smaller batches reduce risk of OOM from activation spikes.
  batch_size: 24
  learning_rate: 0.0001
  weight_decay: 0.0001
  epochs: 100
  # DataLoader workers — g4dn.xlarge has 4 vCPUs, use 2 workers to leave
  # headroom for the main process and OS. Going higher causes CPU contention.
  num_workers: 2
  # Positive/negative ratio for sampling
  pos_neg_ratio: 0.5
  # Data augmentation
  # Loss function: "cross_entropy" or "focal"
  loss:
    type: "cross_entropy"
    label_smoothing: 0.0
    # Focal loss params (only when type=focal)
    focal_gamma: 2.0
    focal_alpha: null   # null = no per-class weighting
  augmentation:
    rotation: true
    flip: true
    scale_range: [0.9, 1.1]
    noise_std: 0.01
    # Elastic deformation improves generalization on LUNA16 (minor speed cost)
    elastic_deformation: true
    elastic_alpha: 15.0
    elastic_sigma: 3.0
    # Intensity perturbation simulates scanner variability
    intensity_shift: 0.05
    intensity_scale: 0.05
    mixup_alpha: 0.0
    # CutOut augmentation — masks random cubic regions for regularization
    cutout: false
    cutout_size: 12
    cutout_n_holes: 1
    # Multi-scale patch training — randomly sample from these sizes
    # during training (resized to canonical patch_size). null = disabled
    multi_scale_patches: null  # e.g. [32, 48, 64]
  # Stochastic Weight Averaging (SWA)
  swa:
    enabled: false
    start_epoch: 75       # Switch to SWA at this epoch
    lr: 0.00005           # SWA learning rate
  # Early stopping patience (epochs)
  early_stopping_patience: 15
  # Learning rate scheduler
  scheduler:
    type: "cosine"        # "cosine" or "cosine_warm_restarts"
    warmup_epochs: 5
    # Warm restarts params (only when type=cosine_warm_restarts)
    t_0: 20               # First restart period
    t_mult: 2             # Period multiplier after each restart

inference:
  # Classification threshold for nodule detection
  # Optimal threshold from Youden's J index on validation set (epoch 76):
  #   0.15 → sensitivity 95.5%, specificity 90.3% (Youden J = 0.862)
  # For screening, favour high sensitivity to minimise missed nodules.
  threshold: 0.15
  # Non-maximum suppression distance in mm
  nms_distance_mm: 10.0
  # Inference batch size — larger than training since no gradients stored.
  # T4 has lower memory bandwidth than A4000; 96 is safe for forward-only.
  batch_size: 96
  # Input validation (verify chest CT before processing)
  validate_input: true
  # Test-Time Augmentation (TTA) — averages predictions over geometric
  # transforms for more robust classification (adds ~Nx inference time)
  tta:
    enabled: false
    n_augments: 8         # Number of augmentation transforms (1-8)

pacs:
  # DICOM Application Entity settings
  local_ae_title: "LUNG_SCREEN_AI"
  local_port: 11112
  # GE Centricity PACS connection
  remote_ae_title: "GEPACS"
  remote_host: "192.168.1.100"
  remote_port: 4006
  # Store incoming studies here
  storage_dir: "./data/incoming"
  # Send results as DICOM Structured Report
  result_format: "SR"

data:
  # Path to LUNA16 / LIDC-IDRI dataset (or prepared training data)
  # Used when data.datasets is not set (legacy single-dataset mode).
  dataset_dir: "./data/luna16"
  # Preprocessed data cache
  cache_dir: "./data/cache"
  # Train/val split ratio
  val_split: 0.2
  # Cap validation candidates for faster epochs (0 = no cap, use all).
  # Keeps all positives and subsamples negatives to this total.
  max_val_candidates: 5000
  # Directory for manually imported DICOM scans & annotations
  training_dir: "./data/training"

  # Multi-dataset training — when present this overrides "dataset_dir".
  #
  # Each entry needs:
  #   type        : "luna16" or "luna25"
  #   dataset_dir : root path for that dataset
  #   enabled     : true/false (optional, default true)
  #   cache_dir   : per-dataset cache override (optional)
  #   val_split   : per-dataset val split override (optional)
  #
  # LUNA25 supports two layouts:
  #   - Nodule blocks: dataset_dir/image/*.npy + annotations.csv
  #   - Full volumes:  dataset_dir/images/*.mha + annotations.csv
  datasets:
    - type: luna16
      dataset_dir: "./data/luna16"
    - type: luna25
      dataset_dir: "./data/luna25"

# False positive reduction (second-stage classifier)
fp_reduction:
  enabled: false
  model_path: ""
  threshold: 0.5

# Confidence calibration
calibration:
  enabled: false
  method: "temperature"  # "temperature" or "platt"
  calibration_file: ""

# Prior study comparison and growth tracking
tracking:
  enabled: false
  tracking_dir: "./data/tracking"

# Radiologist feedback loop
feedback:
  enabled: false
  feedback_dir: "./data/feedback"

# Patient demographics / risk scoring
risk_model:
  enabled: false
  model: "brock"  # Brock/PanCan model

# Incremental retraining from feedback
retrain:
  # Minimum feedback records before retraining is allowed
  min_feedback_records: 20
  # Fine-tuning epochs (lower than initial training)
  epochs: 30
  # Lower learning rate for fine-tuning (10x lower than initial)
  learning_rate: 0.0001
  batch_size: 32
  weight_decay: 0.0001
  # Early stopping patience
  early_stopping_patience: 10
  # Max AUC/sensitivity drop allowed before rejecting new model
  regression_tolerance: 0.01

# Active learning
active_learning:
  strategy: "entropy"  # "entropy", "margin", or "mc_dropout"
  n_select: 50
  mc_forward_passes: 10
