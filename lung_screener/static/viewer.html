<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lung Screener AI — Nodule Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      height: 100vh;
      overflow: hidden;
    }

    #app {
      display: flex;
      height: 100vh;
    }

    /* ── LEFT PANEL ── */
    #left-panel {
      width: 260px;
      min-width: 260px;
      background: #161b22;
      border-right: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .logo {
      padding: 16px;
      font-size: 14px;
      font-weight: 700;
      color: #58a6ff;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo::before { content: "🫁"; font-size: 18px; }

    #upload-area {
      margin: 12px;
      border: 2px dashed #30363d;
      border-radius: 8px;
      padding: 20px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 13px;
      color: #8b949e;
    }
    #upload-area:hover, #upload-area.dragover {
      border-color: #58a6ff;
      background: #0d1b2a;
      color: #c9d1d9;
    }
    #upload-area .upload-icon { font-size: 28px; margin-bottom: 6px; }
    #upload-area .upload-hint { font-size: 11px; margin-top: 4px; color: #6e7681; }

    #upload-progress {
      margin: 0 12px 8px;
      height: 3px;
      background: #21262d;
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }
    #upload-progress-bar {
      height: 100%;
      background: #58a6ff;
      width: 0%;
      transition: width 0.3s;
    }

    #study-info {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 12px;
    }
    #study-info.hidden { display: none; }

    .info-row {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 4px;
      word-break: break-all;
    }
    .info-row strong { color: #c9d1d9; }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6e7681;
      margin: 14px 0 6px;
    }

    #status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      background: #21262d;
      color: #8b949e;
      margin-bottom: 8px;
    }
    #status-badge.queued    { background: #21262d; color: #8b949e; }
    #status-badge.processing { background: #0d2137; color: #58a6ff; }
    #status-badge.complete  { background: #0d2614; color: #3fb950; }
    #status-badge.error     { background: #2d1414; color: #f85149; }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
      animation: pulse 1.5s infinite;
    }
    .status-dot.static { animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .series-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      border: 1px solid transparent;
      margin-bottom: 4px;
      transition: background 0.15s;
    }
    .series-item:hover { background: #21262d; }
    .series-item.active { background: #0d2137; border-color: #58a6ff; }
    .series-item .series-desc { color: #c9d1d9; font-weight: 500; }
    .series-item .series-count { color: #6e7681; font-size: 11px; }

    /* ── CENTER PANEL ── */
    #center-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      min-width: 0;
    }

    #toolbar {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      min-height: 42px;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tool-group + .tool-group {
      padding-left: 10px;
      border-left: 1px solid #30363d;
    }

    .group-label {
      font-size: 10px;
      color: #6e7681;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 2px;
    }

    .preset-btn, .tool-btn {
      padding: 3px 9px;
      border-radius: 4px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .preset-btn:hover, .tool-btn:hover { background: #2d333b; border-color: #58a6ff; }
    .preset-btn.active, .tool-btn.active {
      background: #0d2137;
      border-color: #58a6ff;
      color: #58a6ff;
    }

    .wl-slider {
      -webkit-appearance: none;
      width: 80px;
      height: 3px;
      background: #30363d;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    .wl-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #58a6ff;
      cursor: pointer;
    }
    .wl-value {
      font-size: 11px;
      color: #8b949e;
      min-width: 36px;
      font-variant-numeric: tabular-nums;
    }

    .nodule-toggle label {
      font-size: 12px;
      color: #8b949e;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .nodule-toggle input { cursor: pointer; accent-color: #58a6ff; }

    #viewport-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #welcome-message {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #6e7681;
      gap: 10px;
    }
    .welcome-icon { font-size: 64px; opacity: 0.4; }
    #welcome-message div:nth-child(2) { font-size: 16px; }
    .welcome-sub { font-size: 13px; opacity: 0.7; }

    #cs-element {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #cs-element.hidden { display: none; }

    #overlay-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #overlay-canvas.marking { pointer-events: auto; cursor: crosshair; }
    #overlay-canvas.hidden { display: none; }

    #slice-nav {
      background: #161b22;
      border-top: 1px solid #30363d;
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #slice-nav.hidden { display: none; }

    .nav-btn {
      width: 24px; height: 24px;
      border-radius: 4px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #c9d1d9;
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .nav-btn:hover { background: #2d333b; }

    #slice-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 3px;
      background: #30363d;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    #slice-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #58a6ff;
      cursor: pointer;
    }

    #slice-info {
      font-size: 12px;
      color: #8b949e;
      min-width: 90px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ── RIGHT PANEL ── */
    #right-panel {
      width: 360px;
      min-width: 360px;
      background: #161b22;
      border-left: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-section-title {
      padding: 10px 14px 6px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6e7681;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* Overall Lung-RADS banner */
    #lungrads-banner {
      margin: 10px 12px 0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      display: none;
    }
    #lungrads-banner.lr-1  { background: #0d2614; color: #3fb950; border: 1px solid #238636; }
    #lungrads-banner.lr-2  { background: #0d2137; color: #58a6ff; border: 1px solid #1f6feb; }
    #lungrads-banner.lr-3  { background: #271d00; color: #d29922; border: 1px solid #9e6a03; }
    #lungrads-banner.lr-4A { background: #271900; color: #d18616; border: 1px solid #bd561d; }
    #lungrads-banner.lr-4B { background: #2d1414; color: #f85149; border: 1px solid #da3633; }
    #lungrads-banner.lr-4X { background: #2d1414; color: #f85149; border: 1px solid #da3633; }

    #findings-panel {
      flex: 0 0 auto;
      max-height: 280px;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .empty-state {
      font-size: 13px;
      color: #6e7681;
      text-align: center;
      padding: 20px 0;
    }

    .finding-card {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #21262d;
      border-left-width: 3px;
      background: #0d1117;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .finding-card:hover { background: #161b22; }

    .finding-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .finding-num { font-size: 12px; font-weight: 600; color: #c9d1d9; }

    .lr-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 10px;
    }
    .lr-1  { background: #0d2614; color: #3fb950; }
    .lr-2  { background: #0d2137; color: #58a6ff; }
    .lr-3  { background: #271d00; color: #d29922; }
    .lr-4A { background: #271900; color: #d18616; }
    .lr-4B { background: #2d1414; color: #f85149; }
    .lr-4X { background: #2d1414; color: #f85149; }

    .finding-detail {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 2px;
    }
    .benign-tag {
      font-size: 10px;
      color: #3fb950;
      margin-top: 3px;
    }

    .finding-delete {
      background: none;
      border: none;
      color: #6e7681;
      cursor: pointer;
      font-size: 14px;
      padding: 0 2px;
      line-height: 1;
      margin-left: 4px;
    }
    .finding-delete:hover { color: #f85149; }

    .tool-btn.mark-active { background: #58a6ff; color: #0d1117; }

    #nodule-popup {
      display: none;
      position: fixed;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px 16px;
      z-index: 1000;
      min-width: 200px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      font-size: 13px;
      color: #c9d1d9;
    }
    #nodule-popup label { display: block; margin-bottom: 4px; color: #8b949e; font-size: 11px; }
    #nodule-popup input, #nodule-popup select {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      border-radius: 4px;
      padding: 4px 6px;
      margin-bottom: 10px;
      font-size: 13px;
      box-sizing: border-box;
    }
    #nodule-popup .popup-btns { display: flex; gap: 8px; justify-content: flex-end; }
    #nodule-popup .popup-btns button {
      padding: 4px 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 12px;
    }
    #nodule-popup .btn-confirm { background: #238636; color: #fff; }
    #nodule-popup .btn-cancel  { background: #21262d; color: #c9d1d9; }

    #report-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #report-text {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.7;
      color: #c9d1d9;
      white-space: pre-wrap;
      word-break: break-word;
      background: #0d1117;
      font-family: 'Courier New', monospace;
    }

    .copy-btn {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #30363d;
      background: #21262d;
      color: #8b949e;
      cursor: pointer;
      transition: background 0.15s;
    }
    .copy-btn:hover { background: #2d333b; color: #c9d1d9; }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #484f58; }
  </style>
</head>
<body>
<div id="app">

  <!-- LEFT PANEL -->
  <aside id="left-panel">
    <div class="logo">Lung Screener AI</div>

    <div id="upload-area">
      <div class="upload-icon">⬆</div>
      <div>Drop DICOM files or ZIP here</div>
      <div class="upload-hint">or click to browse</div>
      <input type="file" id="file-input" multiple accept=".dcm,.zip" hidden>
    </div>
    <div id="upload-progress"><div id="upload-progress-bar"></div></div>

    <div id="study-info" class="hidden">
      <div class="section-label">Patient</div>
      <div class="info-row" id="patient-name"></div>
      <div class="info-row" id="patient-id"></div>
      <div class="info-row" id="study-date"></div>
      <div class="info-row" id="study-desc"></div>
      <div style="margin-top:8px">
        <span id="status-badge">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Queued</span>
        </span>
      </div>
      <div class="section-label">Series</div>
      <div id="series-list"></div>
    </div>
  </aside>

  <!-- CENTER PANEL -->
  <main id="center-panel">
    <div id="toolbar">
      <div class="tool-group">
        <span class="group-label">Window</span>
        <button class="preset-btn" id="btn-lung"  onclick="setPreset('lung')">Lung</button>
        <button class="preset-btn" id="btn-medi"  onclick="setPreset('mediastinum')">Mediastinum</button>
        <button class="preset-btn" id="btn-bone"  onclick="setPreset('bone')">Bone</button>
      </div>
      <div class="tool-group">
        <span class="group-label">WW</span>
        <input type="range" class="wl-slider" id="ww-slider" min="1" max="4000" value="1500">
        <span class="wl-value" id="ww-value">1500</span>
      </div>
      <div class="tool-group">
        <span class="group-label">WC</span>
        <input type="range" class="wl-slider" id="wc-slider" min="-1200" max="600" value="-600">
        <span class="wl-value" id="wc-value">-600</span>
      </div>
      <div class="tool-group">
        <button class="tool-btn active" id="btn-wwwc"    onclick="setActiveTool('Wwwc')">W/L</button>
        <button class="tool-btn"        id="btn-pan"     onclick="setActiveTool('Pan')">Pan</button>
        <button class="tool-btn"        id="btn-zoom"    onclick="setActiveTool('Zoom')">Zoom</button>
        <button class="tool-btn"        id="btn-measure" onclick="setActiveTool('Length')">Measure</button>
        <button class="tool-btn"        id="btn-mark"    onclick="setActiveTool('MarkNodule')" title="Click image to mark a missed nodule">+ Nodule</button>
        <button class="tool-btn"        id="btn-clear-m" onclick="clearMeasurements()" title="Erase all ruler measurements">✕ Rulers</button>
      </div>
      <div class="tool-group nodule-toggle">
        <label>
          <input type="checkbox" id="show-nodules" checked>
          Show Nodules
        </label>
      </div>
    </div>

    <div id="viewport-container">
      <div id="welcome-message">
        <div class="welcome-icon">🫁</div>
        <div>Upload a DICOM study to begin</div>
        <div class="welcome-sub">Drag &amp; drop files or use the upload panel</div>
      </div>
      <div id="cs-element" class="hidden"></div>
      <canvas id="overlay-canvas" class="hidden"></canvas>
    </div>

    <div id="nodule-popup">
      <div style="font-weight:600;margin-bottom:10px;font-size:13px;">Add Nodule</div>
      <label>Diameter (mm)</label>
      <input type="number" id="popup-diameter" value="6" min="1" max="60" step="0.5">
      <label>Type</label>
      <select id="popup-type">
        <option value="solid">Solid</option>
        <option value="subsolid">Subsolid / Part-solid</option>
        <option value="ground_glass">Ground Glass</option>
        <option value="calcified">Calcified</option>
      </select>
      <label>Lobe</label>
      <select id="popup-lobe">
        <option value="right upper lobe">Right Upper</option>
        <option value="right middle lobe">Right Middle</option>
        <option value="right lower lobe">Right Lower</option>
        <option value="left upper lobe">Left Upper</option>
        <option value="left lower lobe">Left Lower</option>
        <option value="unknown">Unknown</option>
      </select>
      <div class="popup-btns">
        <button class="btn-cancel" onclick="closeNodulePopup()">Cancel</button>
        <button class="btn-confirm" onclick="confirmAddNodule()">Add</button>
      </div>
    </div>

    <div id="slice-nav" class="hidden">
      <button class="nav-btn" onclick="changeSlice(-1)">‹</button>
      <input type="range" id="slice-slider" min="0" max="0" value="0">
      <button class="nav-btn" onclick="changeSlice(1)">›</button>
      <span id="slice-info">Slice 1 / 1</span>
    </div>
  </main>

  <!-- RIGHT PANEL -->
  <aside id="right-panel">
    <div id="lungrads-banner"></div>

    <div class="panel-section-title" style="display:flex;align-items:center;justify-content:space-between;">
      Findings
      <button class="copy-btn" id="btn-save-corrections" onclick="saveCorrections()" style="display:none" title="Save edits to train the model">Save &amp; Train</button>
    </div>
    <div id="findings-panel">
      <div class="empty-state">No findings yet</div>
    </div>

    <div id="report-container">
      <div class="panel-section-title">
        Report
        <button class="copy-btn" onclick="copyReport()">Copy</button>
      </div>
      <pre id="report-text">Awaiting analysis…</pre>
    </div>
  </aside>

</div>

<!-- Cornerstone.js bundled locally — works fully offline -->
<script src="/static/vendor/dicomParser.min.js"></script>
<script src="/static/vendor/cornerstone.js"></script>
<script src="/static/vendor/cornerstoneMath.min.js"></script>
<script src="/static/vendor/cornerstoneWADOImageLoader.bundle.min.js"></script>
<script src="/static/vendor/cornerstoneTools.js"></script>

<script>
// ── CORNERSTONE INIT ─────────────────────────────────────────────────────────

cornerstoneWADOImageLoader.external.cornerstone = cornerstone;
cornerstoneWADOImageLoader.external.dicomParser  = dicomParser;
cornerstoneWADOImageLoader.configure({ useWebWorkers: false });

cornerstoneTools.external.cornerstone     = cornerstone;
cornerstoneTools.external.cornerstoneMath = cornerstoneMath;
// touchEnabled:false skips Hammer.js entirely (not bundled); mouse input is sufficient.
cornerstoneTools.init({ mouseEnabled: true, touchEnabled: false, showSVGCursors: false });

// ── CUSTOM RAW-SLICE IMAGE LOADER ────────────────────────────────────────────
// Bypasses cornerstoneWADOImageLoader entirely.  The backend serves a compact
// binary blob (32-byte header + int16 pixel data); we decode it here and hand
// a fully-formed Cornerstone image object back to the rendering pipeline.
//
// Header layout (little-endian):
//   0- 3  width          uint32
//   4- 7  height         uint32
//   8-11  minPixelValue  int32
//  12-15  maxPixelValue  int32
//  16-19  intercept      float32
//  20-23  slope          float32
//  24-27  rowSpacing     float32
//  28-31  colSpacing     float32
//  32+    int16 pixel values (row-major)

const _RAW_HEADER_BYTES = 32;

function _rawSliceLoader(imageId) {
  const url = imageId.replace(/^rawslice:/, '');
  const ctrl = new AbortController();

  const promise = fetch(url, { signal: ctrl.signal })
    .then(r => {
      if (!r.ok) throw new Error(`Slice fetch failed: HTTP ${r.status} for ${url}`);
      return r.arrayBuffer();
    })
    .then(buf => {
      const v = new DataView(buf);
      const width      = v.getUint32(0,  true);
      const height     = v.getUint32(4,  true);
      const minPx      = v.getInt32( 8,  true);
      const maxPx      = v.getInt32( 12, true);
      const intercept  = v.getFloat32(16, true);
      const slope      = v.getFloat32(20, true);
      const rowSpacing = v.getFloat32(24, true);
      const colSpacing = v.getFloat32(28, true);

      // Copy into a fresh buffer so the pixelData array owns its memory
      const pixelCount = width * height;
      const pixelBuf   = buf.slice(_RAW_HEADER_BYTES, _RAW_HEADER_BYTES + pixelCount * 2);
      const pixelData  = new Int16Array(pixelBuf);

      return {
        imageId,
        minPixelValue:      minPx,
        maxPixelValue:      maxPx,
        slope,
        intercept,
        windowWidth:        1500,
        windowCenter:       -600,
        getPixelData:       () => pixelData,
        rows:               height,
        columns:            width,
        height,
        width,
        color:              false,
        rgba:               false,
        columnPixelSpacing: colSpacing || 1,
        rowPixelSpacing:    rowSpacing || 1,
        sizeInBytes:        pixelCount * 2,
        invert:             false,
        stats:              {},
      };
    });

  return { promise, cancelFn: () => ctrl.abort() };
}

cornerstone.registerImageLoader('rawslice', _rawSliceLoader);

// ── STATE ────────────────────────────────────────────────────────────────────

let currentStudyId   = null;
let currentSeriesUid = null;
let imageIds         = [];
let currentIndex     = 0;
let findings         = [];
let originalFindings = []; // AI-generated findings before any edits
let pollingTimer     = null;
let toolsRegistered  = false;
let csEnabled        = false;

// ── DOM REFS ─────────────────────────────────────────────────────────────────

const csEl         = document.getElementById('cs-element');
const overlayCanvas= document.getElementById('overlay-canvas');
const overlayCtx   = overlayCanvas.getContext('2d');
const uploadArea   = document.getElementById('upload-area');
const fileInput    = document.getElementById('file-input');

// ── UPLOAD ───────────────────────────────────────────────────────────────────

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover',  (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', ()  => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

async function handleFiles(files) {
  if (!files || !files.length) return;

  setStatus('uploading', 'Uploading…');
  showProgress(true);

  const formData = new FormData();
  for (const f of files) formData.append('files', f);

  try {
    const resp = await fetch('/api/studies/upload', { method: 'POST', body: formData });
    if (!resp.ok) {
      const msg = await resp.text();
      throw new Error(msg);
    }
    const data = await resp.json();
    currentStudyId = data.study_id;
    showProgress(false);
    populateStudyInfo(data.series);
    loadSeriesIntoViewer(Object.values(data.series));
    startPolling();
  } catch (e) {
    showProgress(false);
    setStatus('error', 'Upload failed: ' + e.message);
  }
}

function showProgress(on) {
  const bar = document.getElementById('upload-progress');
  if (on) { bar.style.display = 'block'; animateProgressBar(); }
  else     { bar.style.display = 'none'; document.getElementById('upload-progress-bar').style.width = '0%'; }
}

function animateProgressBar() {
  let w = 0;
  const bar = document.getElementById('upload-progress-bar');
  const id = setInterval(() => {
    w = Math.min(w + 5, 90);
    bar.style.width = w + '%';
    if (w >= 90) clearInterval(id);
  }, 100);
}

// ── STUDY INFO ───────────────────────────────────────────────────────────────

function populateStudyInfo(seriesMap) {
  const first = Object.values(seriesMap)[0] || {};
  document.getElementById('patient-name').innerHTML =
    '<strong>Patient:</strong> ' + (first.patient_name || 'Unknown');
  document.getElementById('patient-id').innerHTML =
    '<strong>ID:</strong> ' + (first.patient_id || '—');
  document.getElementById('study-date').innerHTML =
    '<strong>Date:</strong> ' + formatDate(first.study_date);
  document.getElementById('study-desc').innerHTML =
    '<strong>Study:</strong> ' + (first.study_description || '—');
  document.getElementById('study-info').classList.remove('hidden');

  const seriesList = document.getElementById('series-list');
  seriesList.innerHTML = Object.values(seriesMap).map(s => `
    <div class="series-item ${s.modality === 'CT' ? 'active' : ''}"
         onclick="selectSeries('${s.series_uid}')">
      <div class="series-desc">${s.description || s.modality}</div>
      <div class="series-count">${s.instances.length} images · ${s.modality}</div>
    </div>
  `).join('');
}

function selectSeries(seriesUid) {
  // TODO: allow switching between series
  document.querySelectorAll('.series-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

// ── POLLING ──────────────────────────────────────────────────────────────────

function startPolling() {
  if (pollingTimer) clearInterval(pollingTimer);
  setStatus('processing', 'Running AI analysis…');
  pollingTimer = setInterval(async () => {
    if (!currentStudyId) return;
    try {
      const resp = await fetch(`/api/studies/${currentStudyId}/status`);
      const data = await resp.json();
      if (data.status === 'complete') {
        clearInterval(pollingTimer);
        await loadResults();
      } else if (data.status === 'error') {
        clearInterval(pollingTimer);
        setStatus('error', 'Analysis error: ' + (data.error || 'unknown'));
      }
    } catch (_) {}
  }, 2000);
}

async function loadResults() {
  try {
    const [rRes, rpRes] = await Promise.all([
      fetch(`/api/studies/${currentStudyId}/results`),
      fetch(`/api/studies/${currentStudyId}/report`),
    ]);
    if (rRes.ok) {
      const data = await rRes.json();
      findings = data.findings || [];
      originalFindings = JSON.parse(JSON.stringify(findings)); // deep-copy for diffing
      renderLungRadsBanner(data.lung_rads_overall);
      renderFindings(findings);
      drawOverlay();
      document.getElementById('btn-save-corrections').style.display = 'inline-block';
      const n = findings.length;
      setStatus('complete',
        `Complete — LR-${data.lung_rads_overall} — ${n} finding${n !== 1 ? 's' : ''}`);
    }
    if (rpRes.ok) {
      const data = await rpRes.json();
      document.getElementById('report-text').textContent =
        data.report || 'No significant findings.';
    }
  } catch (e) {
    setStatus('error', 'Failed to load results: ' + e.message);
  }
}

// ── VIEWER ───────────────────────────────────────────────────────────────────

async function loadSeriesIntoViewer(seriesArray) {
  // Pick the CT series with the most images
  const series = seriesArray
    .filter(s => s.modality === 'CT')
    .sort((a, b) => b.instances.length - a.instances.length)[0]
    || seriesArray[0];

  if (!series || !series.instances.length) return;
  currentSeriesUid = series.series_uid;

  // Use the custom rawslice: loader which bypasses cornerstoneWADOImageLoader.
  // The backend endpoint returns a simple binary blob the loader decodes directly,
  // so DICOM transfer-syntax compatibility issues in the browser are irrelevant.
  imageIds = series.instances.map(inst =>
    `rawslice:/api/studies/${currentStudyId}/slice/${encodeURIComponent(inst.filename)}`
  );

  // Reveal viewport elements
  document.getElementById('welcome-message').style.display = 'none';
  csEl.classList.remove('hidden');
  overlayCanvas.classList.remove('hidden');
  const nav = document.getElementById('slice-nav');
  nav.classList.remove('hidden');

  // Slice slider range
  const slider = document.getElementById('slice-slider');
  slider.max   = imageIds.length - 1;
  slider.value = 0;

  // Enable cornerstone on element (only once — re-enabling corrupts the render loop).
  // Explicitly opt-out of WebGL (CS WAX) — it fails in many headless/GPU-less envs;
  // Cornerstone's Canvas 2D renderer is reliable and sufficient for grayscale CT.
  if (!csEnabled) {
    cornerstone.enable(csEl, { renderer: 'canvas' });
    csEnabled = true;
  }

  // Register tools once
  if (!toolsRegistered) {
    cornerstoneTools.addTool(cornerstoneTools.WwwcTool);
    cornerstoneTools.addTool(cornerstoneTools.PanTool);
    cornerstoneTools.addTool(cornerstoneTools.ZoomTool);
    cornerstoneTools.addTool(cornerstoneTools.LengthTool);
    cornerstoneTools.addTool(cornerstoneTools.StackScrollMouseWheelTool);
    toolsRegistered = true;
  }

  // Bind stack state so scroll tool works
  cornerstoneTools.addStackStateManager(csEl, ['stack']);
  cornerstoneTools.addToolState(csEl, 'stack', {
    currentImageIdIndex: 0,
    imageIds,
  });

  cornerstoneTools.setToolActive('Wwwc',                  { mouseButtonMask: 1 });
  cornerstoneTools.setToolActive('Pan',                   { mouseButtonMask: 4 });
  cornerstoneTools.setToolActive('StackScrollMouseWheel', {});
  cornerstoneTools.setToolPassive('Zoom');
  cornerstoneTools.setToolPassive('Length');

  // Listen for renders to keep overlay in sync (guard against duplicate listeners)
  csEl.removeEventListener('cornerstoneimagerendered', onImageRendered);
  csEl.addEventListener('cornerstoneimagerendered', onImageRendered);

  await displaySlice(0);

  // After the browser has painted, force a resize so the viewport scale is
  // recomputed from the correct canvas dimensions.  Without this, if the canvas
  // was zero-sized when cornerstone.enable() ran, scale stays 0 → black image.
  requestAnimationFrame(() => {
    cornerstone.resize(csEl, true);   // forceFitToWindow = true → calls fitToWindow
    setPreset('lung');
  });
}

async function displaySlice(idx) {
  if (idx < 0 || idx >= imageIds.length) return;
  currentIndex = idx;

  // Update nav immediately — always shows the correct count even on load failure
  document.getElementById('slice-slider').value = idx;
  document.getElementById('slice-info').textContent =
    `Slice ${idx + 1} / ${imageIds.length}`;

  try {
    const image = await cornerstone.loadAndCacheImage(imageIds[idx]);
    cornerstone.displayImage(csEl, image);

    // Sync stack tool state
    const stackData = cornerstoneTools.getToolState(csEl, 'stack');
    if (stackData && stackData.data[0]) {
      stackData.data[0].currentImageIdIndex = idx;
    }
  } catch (e) {
    console.error('Failed to load slice', idx, e);
    // Surface the error in the slice counter so it's visible without devtools
    document.getElementById('slice-info').textContent =
      `Slice ${idx + 1} / ${imageIds.length} — ERROR: ${e.message}`;
  }
}

function onImageRendered() {
  syncWLSliders();
  resizeOverlay();
  drawOverlay();
}

// ── NAVIGATION ───────────────────────────────────────────────────────────────

function changeSlice(delta) {
  displaySlice(currentIndex + delta);
}

document.getElementById('slice-slider').addEventListener('input', (e) => {
  displaySlice(parseInt(e.target.value));
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeNodulePopup();
    if (isMarkingNodule) setActiveTool('Wwwc');
    return;
  }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowUp'   || e.key === 'ArrowRight') changeSlice(1);
  if (e.key === 'ArrowDown' || e.key === 'ArrowLeft')  changeSlice(-1);
});

// Click outside popup closes it
document.addEventListener('mousedown', (e) => {
  const popup = document.getElementById('nodule-popup');
  if (popup.style.display === 'block' && !popup.contains(e.target)) {
    closeNodulePopup();
  }
});

// ── WINDOWING ────────────────────────────────────────────────────────────────

const PRESETS = {
  lung:        { ww: 1500, wc: -600 },
  mediastinum: { ww: 350,  wc:  40  },
  bone:        { ww: 2000, wc:  300 },
};

function setPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  applyWL(p.ww, p.wc);
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + name.slice(0, 4)).classList.add('active');
}

function applyWL(ww, wc) {
  try {
    const vp = cornerstone.getViewport(csEl);
    if (vp) {
      vp.voi.windowWidth  = ww;
      vp.voi.windowCenter = wc;
      cornerstone.setViewport(csEl, vp);
    }
  } catch (_) {}
  updateWLDisplays(ww, wc);
}

function updateWLDisplays(ww, wc) {
  document.getElementById('ww-slider').value = ww;
  document.getElementById('wc-slider').value = wc;
  document.getElementById('ww-value').textContent = Math.round(ww);
  document.getElementById('wc-value').textContent = Math.round(wc);
}

function syncWLSliders() {
  try {
    const vp = cornerstone.getViewport(csEl);
    if (vp) updateWLDisplays(vp.voi.windowWidth, vp.voi.windowCenter);
  } catch (_) {}
}

document.getElementById('ww-slider').addEventListener('input', (e) => {
  const ww = parseInt(e.target.value);
  document.getElementById('ww-value').textContent = ww;
  try {
    const vp = cornerstone.getViewport(csEl);
    if (vp) { vp.voi.windowWidth = ww; cornerstone.setViewport(csEl, vp); }
  } catch (_) {}
});

document.getElementById('wc-slider').addEventListener('input', (e) => {
  const wc = parseInt(e.target.value);
  document.getElementById('wc-value').textContent = wc;
  try {
    const vp = cornerstone.getViewport(csEl);
    if (vp) { vp.voi.windowCenter = wc; cornerstone.setViewport(csEl, vp); }
  } catch (_) {}
});

// ── TOOLS ────────────────────────────────────────────────────────────────────

const TOOL_BTNS = { Wwwc: 'btn-wwwc', Pan: 'btn-pan', Zoom: 'btn-zoom', Length: 'btn-measure' };

let isMarkingNodule = false;
let pendingNodulePt = null; // { voxel_x, voxel_y, voxel_z }

function setActiveTool(toolName) {
  // Clear mark-nodule mode
  isMarkingNodule = false;
  overlayCanvas.classList.remove('marking');
  document.getElementById('btn-mark')?.classList.remove('mark-active');
  closeNodulePopup();

  Object.entries(TOOL_BTNS).forEach(([t, id]) => {
    cornerstoneTools.setToolPassive(t);
    document.getElementById(id)?.classList.remove('active');
  });
  cornerstoneTools.setToolActive('StackScrollMouseWheel', {});
  cornerstoneTools.setToolActive('Pan', { mouseButtonMask: 4 });

  if (toolName === 'MarkNodule') {
    isMarkingNodule = true;
    overlayCanvas.classList.add('marking');
    document.getElementById('btn-mark')?.classList.add('mark-active');
    return;
  }

  cornerstoneTools.setToolActive(toolName, { mouseButtonMask: 1 });
  document.getElementById(TOOL_BTNS[toolName])?.classList.add('active');
}

function clearMeasurements() {
  if (!csEnabled) return;
  cornerstoneTools.clearToolState(csEl, 'Length');
  cornerstone.updateImage(csEl);
}

// ── MARK NODULE — canvas click handler ───────────────────────────────────────

overlayCanvas.addEventListener('click', function(e) {
  if (!isMarkingNodule) return;
  const rect = overlayCanvas.getBoundingClientRect();
  const canvasPt = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  const pixelPt  = cornerstone.canvasToPixel(csEl, canvasPt);
  pendingNodulePt = { voxel_x: Math.round(pixelPt.x), voxel_y: Math.round(pixelPt.y), voxel_z: currentIndex };

  const popup = document.getElementById('nodule-popup');
  // Position popup near click, keeping it on screen
  let px = e.clientX + 12, py = e.clientY - 20;
  if (px + 220 > window.innerWidth)  px = e.clientX - 232;
  if (py + 280 > window.innerHeight) py = window.innerHeight - 285;
  popup.style.left = px + 'px';
  popup.style.top  = py + 'px';
  popup.style.display = 'block';
});

function closeNodulePopup() {
  document.getElementById('nodule-popup').style.display = 'none';
  pendingNodulePt = null;
}

function calcLungRads(diameterMm, type) {
  // Simplified Lung-RADS 1.1 size thresholds for newly added nodules
  if (type === 'calcified') return '1';
  if (type === 'ground_glass' || type === 'subsolid') {
    if (diameterMm < 6)  return '2';
    if (diameterMm < 30) return '3';
    return '4A';
  }
  // solid
  if (diameterMm < 6)  return '1';
  if (diameterMm < 8)  return '3';
  if (diameterMm < 15) return '4A';
  return '4B';
}

function confirmAddNodule() {
  if (!pendingNodulePt) return;
  const diameter = parseFloat(document.getElementById('popup-diameter').value) || 6;
  const type     = document.getElementById('popup-type').value;
  const lobe     = document.getElementById('popup-lobe').value;
  const lr       = calcLungRads(diameter, type);

  findings.push({
    voxel_x:     pendingNodulePt.voxel_x,
    voxel_y:     pendingNodulePt.voxel_y,
    voxel_z:     pendingNodulePt.voxel_z,
    diameter_mm: diameter,
    nodule_type: type,
    lobe,
    lung_rads:   lr,
    confidence:  1.0,
    _manual:     true,
  });

  closeNodulePopup();
  renderFindings(findings);
  drawOverlay();
}

// ── NODULE OVERLAY ────────────────────────────────────────────────────────────

function lrColor(cat) {
  const map = { '1': '#3fb950', '2': '#58a6ff', '3': '#d29922',
                '4A': '#d18616', '4B': '#f85149', '4X': '#f85149' };
  return map[cat] || '#c9d1d9';
}

function resizeOverlay() {
  const rect = csEl.getBoundingClientRect();
  overlayCanvas.width  = rect.width;
  overlayCanvas.height = rect.height;
}

function drawOverlay() {
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  if (!document.getElementById('show-nodules').checked) return;
  if (!findings.length) return;

  let enabledEl;
  try { enabledEl = cornerstone.getEnabledElement(csEl); }
  catch (_) { return; }

  const image = enabledEl.image;
  const vp    = cornerstone.getViewport(csEl);
  if (!image || !vp) return;

  const rowSpacing = image.rowPixelSpacing || 1.0;

  findings.forEach((f, idx) => {
    const sliceDiff = Math.abs((f.voxel_z || 0) - currentIndex);
    if (sliceDiff > 3) return;

    const canvasPt = cornerstone.pixelToCanvas(csEl, { x: f.voxel_x || 0, y: f.voxel_y || 0 });
    const radiusPx = (f.diameter_mm / 2.0) / rowSpacing * vp.scale;

    const alpha = sliceDiff === 0 ? 1.0 : Math.max(0.15, 0.7 - sliceDiff * 0.2);
    const color = lrColor(f.lung_rads);

    overlayCtx.save();
    overlayCtx.globalAlpha = alpha;

    // Outer circle
    overlayCtx.beginPath();
    overlayCtx.arc(canvasPt.x, canvasPt.y, radiusPx, 0, 2 * Math.PI);
    overlayCtx.strokeStyle = color;
    overlayCtx.lineWidth   = 2;
    overlayCtx.stroke();

    // Cross-hair center dot
    overlayCtx.beginPath();
    overlayCtx.arc(canvasPt.x, canvasPt.y, 3, 0, 2 * Math.PI);
    overlayCtx.fillStyle = color;
    overlayCtx.fill();

    // Label on the active slice only
    if (sliceDiff === 0) {
      const label = `#${idx + 1} · ${f.diameter_mm} mm · LR-${f.lung_rads}`;
      overlayCtx.font         = 'bold 12px monospace';
      overlayCtx.shadowColor  = '#000';
      overlayCtx.shadowBlur   = 4;
      overlayCtx.fillStyle    = color;
      overlayCtx.fillText(label, canvasPt.x + radiusPx + 6, canvasPt.y + 4);
      overlayCtx.shadowBlur   = 0;
    }

    overlayCtx.restore();
  });
}

document.getElementById('show-nodules').addEventListener('change', drawOverlay);
window.addEventListener('resize', () => {
  if (csEnabled) cornerstone.resize(csEl, true);
  resizeOverlay();
  drawOverlay();
});

// ── FINDINGS PANEL ────────────────────────────────────────────────────────────

function renderLungRadsBanner(cat) {
  const banner = document.getElementById('lungrads-banner');
  const lrKey  = cat.replace('/', '');
  banner.className = `lr-${lrKey}`;
  banner.textContent = `Overall Lung-RADS Category ${cat}`;
  banner.style.display = 'block';
}

function deleteFinding(origIdx) {
  findings.splice(origIdx, 1);
  renderFindings(findings);
  drawOverlay();
}

function renderFindings(list) {
  const panel = document.getElementById('findings-panel');
  if (!list.length) {
    panel.innerHTML = '<div class="empty-state">No significant nodules detected</div>';
    return;
  }
  // Sort by size descending but track original index for deletion
  const indexed = list.map((f, i) => ({ f, i })).sort((a, b) => b.f.diameter_mm - a.f.diameter_mm);
  panel.innerHTML = indexed.map(({ f, i }, displayNum) => {
    const calcTag = f.calcification?.is_benign
      ? '<div class="benign-tag">✓ Benign calcification pattern</div>' : '';
    const lrKey   = (f.lung_rads || '1').replace('/', '');
    const manualTag = f._manual ? '<div class="benign-tag" style="color:#58a6ff">✎ Manually added</div>' : '';
    const confLine  = f._manual ? '' : `<div class="finding-detail">Confidence: ${(f.confidence * 100).toFixed(1)}%</div>`;
    return `
    <div class="finding-card"
         style="border-left-color:${lrColor(f.lung_rads)}"
         onclick="jumpToFinding(${f.voxel_z || 0})">
      <div class="finding-header">
        <span class="finding-num">Nodule ${displayNum + 1}${f._manual ? ' ✎' : ''}</span>
        <span style="display:flex;align-items:center;gap:4px">
          <span class="lr-badge lr-${lrKey}">LR-${f.lung_rads}</span>
          <button class="finding-delete" title="Remove (false positive)"
                  onclick="event.stopPropagation();deleteFinding(${i})">×</button>
        </span>
      </div>
      <div class="finding-detail">${capitalize(f.lobe) || 'Location unknown'}</div>
      <div class="finding-detail">${f.diameter_mm} mm &nbsp;·&nbsp; ${fmtType(f.nodule_type)}</div>
      ${confLine}
      ${calcTag}${manualTag}
    </div>`;
  }).join('');
}

function jumpToFinding(voxelZ) {
  displaySlice(voxelZ);
}

// ── STATUS ────────────────────────────────────────────────────────────────────

function setStatus(state, text) {
  const badge = document.getElementById('status-badge');
  const dot   = document.getElementById('status-dot');
  const label = document.getElementById('status-text');
  badge.className = 'status-badge ' + state;   // CSS handles coloring
  badge.id = 'status-badge';
  badge.style.cssText = '';

  // Apply inline styles from original CSS classes
  const styles = {
    queued:     'background:#21262d;color:#8b949e',
    uploading:  'background:#0d2137;color:#58a6ff',
    processing: 'background:#0d2137;color:#58a6ff',
    complete:   'background:#0d2614;color:#3fb950',
    error:      'background:#2d1414;color:#f85149',
  };
  badge.setAttribute('style',
    `display:inline-flex;align-items:center;gap:5px;font-size:11px;
     padding:2px 8px;border-radius:12px;${styles[state] || styles.queued}`);

  dot.className = 'status-dot' + (state === 'complete' || state === 'error' ? ' static' : '');
  dot.style.cssText = `width:6px;height:6px;border-radius:50%;background:currentColor;
    animation:${(state === 'processing' || state === 'uploading') ? 'pulse 1.5s infinite' : 'none'}`;
  label.textContent = text;
}

// ── REPORT ────────────────────────────────────────────────────────────────────

function copyReport() {
  const text = document.getElementById('report-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  });
}

// ── UTILITIES ─────────────────────────────────────────────────────────────────

function formatDate(yyyymmdd) {
  if (!yyyymmdd || yyyymmdd.length < 8) return yyyymmdd || '—';
  return `${yyyymmdd.slice(0,4)}-${yyyymmdd.slice(4,6)}-${yyyymmdd.slice(6,8)}`;
}

function fmtType(t) {
  return { solid: 'Solid', part_solid: 'Part-solid', ground_glass: 'Ground-glass' }[t] || t;
}

function capitalize(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

// ── SAVE CORRECTIONS ──────────────────────────────────────────────────────────

async function saveCorrections() {
  if (!currentStudyId) return;

  const btn = document.getElementById('btn-save-corrections');
  const origText = btn.textContent;
  btn.textContent = 'Saving…';
  btn.disabled = true;

  // Build correction payload:
  // - AI findings that were deleted → rejected (false positives)
  // - Current findings that were manually added → new positives
  // - AI findings that survive → confirmed
  const aiIds = new Set(originalFindings.map((_, i) => i));
  const survivingAiIndices = new Set();

  const corrections = [];

  // Walk original AI findings — mark confirmed or rejected
  originalFindings.forEach((orig, idx) => {
    // A finding is "surviving" if a current finding has matching voxel coords
    const stillPresent = findings.some(f =>
      !f._manual &&
      Math.abs((f.voxel_x || 0) - (orig.voxel_x || 0)) < 2 &&
      Math.abs((f.voxel_y || 0) - (orig.voxel_y || 0)) < 2 &&
      Math.abs((f.voxel_z || 0) - (orig.voxel_z || 0)) < 2
    );
    corrections.push({
      finding_id: orig.finding_id || `ai_${currentStudyId}_${idx}`,
      series_uid: currentSeriesUid || '',
      is_manual:  false,
      confirmed:  stillPresent,
      ai_x:    orig.voxel_x || 0,
      ai_y:    orig.voxel_y || 0,
      ai_z:    orig.voxel_z || 0,
      ai_diameter_mm: orig.diameter_mm || 0,
      ai_confidence:  orig.confidence  || 0,
      ai_lung_rads:   orig.lung_rads   || '1',
      // Radiologist values = same as AI for confirmed, empty for rejected
      radiologist_diameter_mm: stillPresent ? (orig.diameter_mm || 0) : 0,
      radiologist_lung_rads:   stillPresent ? (orig.lung_rads   || '1') : '',
    });
  });

  // Walk manually added findings — new positives the AI missed
  findings.filter(f => f._manual).forEach((f, idx) => {
    corrections.push({
      finding_id: `manual_${currentStudyId}_${idx}`,
      series_uid: currentSeriesUid || '',
      is_manual:  true,
      confirmed:  true,
      ai_x:    f.voxel_x || 0,
      ai_y:    f.voxel_y || 0,
      ai_z:    f.voxel_z || 0,
      ai_diameter_mm: 0,
      ai_confidence:  0,
      ai_lung_rads:   '1',
      radiologist_diameter_mm: f.diameter_mm || 0,
      radiologist_lung_rads:   f.lung_rads   || '1',
    });
  });

  try {
    const resp = await fetch(`/api/studies/${currentStudyId}/corrections`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ series_uid: currentSeriesUid || '', corrections }),
    });
    if (!resp.ok) throw new Error(await resp.text());
    const result = await resp.json();
    btn.textContent = `Saved (${result.recorded} records)`;
    btn.style.background = '#238636';
    setTimeout(() => {
      btn.textContent = origText;
      btn.style.background = '';
      btn.disabled = false;
    }, 3000);
  } catch (e) {
    btn.textContent = 'Error — retry';
    btn.style.background = '#6e2020';
    btn.disabled = false;
    console.error('saveCorrections:', e);
  }
}
</script>
</body>
</html>
