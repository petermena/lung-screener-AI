# Lung Screener AI — Docker Compose Deployment
#
# Usage:
#   docker compose up -d            # Start PACS listener (ONNX, CPU)
#   docker compose --profile gpu up -d  # Start with GPU support
#   docker compose logs -f lung-screener  # View logs
#   docker compose down               # Stop
#
# The DICOM SCP listens on port 11112 and processes incoming CT studies.
# Results are sent back to the configured PACS as Structured Reports.

services:
  lung-screener:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODEL_PATH: ./checkpoints/best.pth
    image: lung-screener:latest
    container_name: lung-screener
    ports:
      - "11112:11112"
    volumes:
      - ./data/incoming:/app/data/incoming
      - ./data/feedback:/app/data/feedback
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: ["serve", "-m", "/app/model/model.onnx"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',11112)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  lung-screener-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
      args:
        MODEL_PATH: ./checkpoints/best.pth
    image: lung-screener-gpu:latest
    container_name: lung-screener-gpu
    ports:
      - "11112:11112"
    volumes:
      - ./data/incoming:/app/data/incoming
      - ./data/feedback:/app/data/feedback
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    command: ["serve", "-m", "/app/model/model.pth"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',11112)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    profiles:
      - gpu
